<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" width="1280" height="840" role="img" aria-label="Workflow: three starting points that all lead into the implement skill and end in a pull request">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151235"/></linearGradient>
<radialGradient id="g1" cx="0.12" cy="0.1" r="0.5"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.28"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="0.9" cy="0.95" r="0.55"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<linearGradient id="band" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
<linearGradient id="rail" gradientUnits="userSpaceOnUse" x1="135" y1="0" x2="1045" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="0.5" stop-color="#22d3ee"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06"/></pattern>
<filter id="glow" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/></filter>
<marker id="arrow-a78bfa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
<marker id="arrow-22d3ee" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/></marker>
<marker id="arrow-fb7185" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fb7185"/></marker>
<marker id="arrow-34d399" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
<marker id="arrow-fbbf24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker>
</defs>
<rect width="1280" height="840" rx="24" fill="url(#bg)"/>
<rect width="1280" height="840" rx="24" fill="url(#g1)"/>
<rect width="1280" height="840" rx="24" fill="url(#g2)"/>
<rect width="1280" height="840" rx="24" fill="url(#dots)"/>
<text x="40" y="58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="url(#title)" text-anchor="start" letter-spacing="0">From idea to pull request</text>
<text x="40" y="84" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a5b0cf" text-anchor="start" letter-spacing="0">Start wherever you are. Every path leads into implement.</text>
<text x="235" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#a78bfa" text-anchor="middle" letter-spacing="2">START HERE</text>
<rect x="75.0" y="136" width="320" height="52" rx="26.0" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa" stroke-width="1.5" filter="url(#glow)"/>
<text x="235" y="168" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#f8fafc" text-anchor="middle" letter-spacing="0">An idea, no ticket yet</text>
<text x="640" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#22d3ee" text-anchor="middle" letter-spacing="2">START HERE</text>
<rect x="480.0" y="136" width="320" height="52" rx="26.0" fill="#22d3ee" fill-opacity="0.16" stroke="#22d3ee" stroke-width="1.5" filter="url(#glow)"/>
<text x="640" y="168" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#f8fafc" text-anchor="middle" letter-spacing="0">A ticket, task or known bug</text>
<text x="1045" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#fb7185" text-anchor="middle" letter-spacing="2">START HERE</text>
<rect x="885.0" y="136" width="320" height="52" rx="26.0" fill="#fb7185" fill-opacity="0.16" stroke="#fb7185" stroke-width="1.5" filter="url(#glow)"/>
<text x="1045" y="168" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#f8fafc" text-anchor="middle" letter-spacing="0">A problem, cause unknown</text>
<path d="M175,188 L135,236" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-a78bfa)"/>
<path d="M295,188 L335,236" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-a78bfa)"/>
<text x="92" y="218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#a5b0cf" text-anchor="middle" letter-spacing="0">one ticket</text>
<text x="382" y="218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#a5b0cf" text-anchor="middle" letter-spacing="0">several</text>
<rect x="35" y="240" width="200" height="116" rx="14" fill="#141a33" stroke="#a78bfa" stroke-width="1.5" filter="url(#glow)"/>
<rect x="35" y="254" width="4" height="88" rx="2" fill="#a78bfa"/>
<text x="53" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#a78bfa" text-anchor="start" letter-spacing="0">ticket-creator</text>
<text x="53" y="298" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#f8fafc" text-anchor="start" letter-spacing="0">One ticket, approved</text>
<text x="53" y="317" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#f8fafc" text-anchor="start" letter-spacing="0">before it is created.</text>
<rect x="245" y="240" width="200" height="116" rx="14" fill="#141a33" stroke="#a78bfa" stroke-width="1.5" filter="url(#glow)"/>
<rect x="245" y="254" width="4" height="88" rx="2" fill="#a78bfa"/>
<text x="263" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#a78bfa" text-anchor="start" letter-spacing="0">ticket-orchestrator</text>
<text x="263" y="298" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#f8fafc" text-anchor="start" letter-spacing="0">Many tickets, sliced</text>
<text x="263" y="317" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#f8fafc" text-anchor="start" letter-spacing="0">and linked as a set.</text>
<path d="M135,356 L135,400" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round"/>
<path d="M335,356 L335,400" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round"/>
<text x="235" y="384" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#a5b0cf" text-anchor="middle" letter-spacing="0">pick up a ticket</text>
<path d="M640,188 L640,400" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round"/>
<rect x="490" y="262" width="300" height="60" rx="14" fill="#0b1020" stroke="#22d3ee" stroke-opacity="0.5" stroke-dasharray="4 5"/>
<text x="640" y="288" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#f8fafc" text-anchor="middle" letter-spacing="0">No detour needed.</text>
<text x="640" y="308" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#a5b0cf" text-anchor="middle" letter-spacing="0">Just ask for the implementation.</text>
<path d="M1045,188 L1045,236" fill="none" stroke="#fb7185" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-fb7185)"/>
<rect x="875" y="240" width="340" height="116" rx="14" fill="#141a33" stroke="#fb7185" stroke-width="1.5" filter="url(#glow)"/>
<rect x="875" y="254" width="4" height="88" rx="2" fill="#fb7185"/>
<text x="893" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#fb7185" text-anchor="start" letter-spacing="0">investigate</text>
<text x="893" y="298" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#f8fafc" text-anchor="start" letter-spacing="0">Evidence first, one hypothesis at a time.</text>
<text x="893" y="317" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#f8fafc" text-anchor="start" letter-spacing="0">Proves the cause. Fixes nothing.</text>
<text x="893" y="342" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#a5b0cf" text-anchor="start" letter-spacing="0">no ticket yet?  &#8594;  ticket-creator drafts one</text>
<path d="M1045,356 L1045,400" fill="none" stroke="#fb7185" stroke-width="2" stroke-linejoin="round"/>
<text x="1059" y="384" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#a5b0cf" text-anchor="start" letter-spacing="0">cause proven</text>
<path d="M135,400 L1045,400" stroke="url(#rail)" stroke-width="2" fill="none"/>
<path d="M205,400 L205,430" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-22d3ee)"/>
<rect x="35" y="432" width="1210" height="262" rx="20" fill="#0e1430" fill-opacity="0.85" stroke="url(#band)" stroke-width="2" filter="url(#glow)"/>
<text x="60" y="468" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="800" fill="url(#band)" text-anchor="start" letter-spacing="0">implement</text>
<text x="182" y="468" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#a5b0cf" text-anchor="start" letter-spacing="0">runs four phases in order. Each one ends with your approval, and each skill also works on its own.</text>
<rect x="60" y="488" width="262" height="126" rx="14" fill="#141a33" stroke="#22d3ee" stroke-width="1.5" filter="url(#glow)"/>
<rect x="60" y="502" width="4" height="98" rx="2" fill="#22d3ee"/>
<circle cx="90" cy="515" r="12" fill="#22d3ee"/>
<text x="90" y="520" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#0b1020" text-anchor="middle" letter-spacing="0">1</text>
<text x="112" y="520" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#22d3ee" text-anchor="start" letter-spacing="0">refine</text>
<text x="78" y="546" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#f8fafc" text-anchor="start" letter-spacing="0">Asks what changes the outcome.</text>
<text x="78" y="565" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#f8fafc" text-anchor="start" letter-spacing="0">Writes spec.md, updates glossary.</text>
<rect x="356" y="488" width="262" height="126" rx="14" fill="#141a33" stroke="#60a5fa" stroke-width="1.5" filter="url(#glow)"/>
<rect x="356" y="502" width="4" height="98" rx="2" fill="#60a5fa"/>
<circle cx="386" cy="515" r="12" fill="#60a5fa"/>
<text x="386" y="520" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#0b1020" text-anchor="middle" letter-spacing="0">2</text>
<text x="408" y="520" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#60a5fa" text-anchor="start" letter-spacing="0">strategic-design</text>
<text x="374" y="546" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#f8fafc" text-anchor="start" letter-spacing="0">Refactor first, or not?</text>
<text x="374" y="565" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#f8fafc" text-anchor="start" letter-spacing="0">Writes plan.md, does the refactor.</text>
<text x="374" y="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#a5b0cf" text-anchor="start" letter-spacing="0">decision made?  &#8594;  adr records it</text>
<rect x="652" y="488" width="262" height="126" rx="14" fill="#141a33" stroke="#818cf8" stroke-width="1.5" filter="url(#glow)"/>
<rect x="652" y="502" width="4" height="98" rx="2" fill="#818cf8"/>
<circle cx="682" cy="515" r="12" fill="#818cf8"/>
<text x="682" y="520" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#0b1020" text-anchor="middle" letter-spacing="0">3</text>
<text x="704" y="520" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#818cf8" text-anchor="start" letter-spacing="0">build</text>
<text x="670" y="546" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#f8fafc" text-anchor="start" letter-spacing="0">One fresh subagent per plan step.</text>
<text x="670" y="565" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#f8fafc" text-anchor="start" letter-spacing="0">Test-driven; bugs reproduce first.</text>
<text x="670" y="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#a5b0cf" text-anchor="start" letter-spacing="0">won't reproduce?  &#8594;  investigate</text>
<rect x="948" y="488" width="262" height="126" rx="14" fill="#141a33" stroke="#a78bfa" stroke-width="1.5" filter="url(#glow)"/>
<rect x="948" y="502" width="4" height="98" rx="2" fill="#a78bfa"/>
<circle cx="978" cy="515" r="12" fill="#a78bfa"/>
<text x="978" y="520" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#0b1020" text-anchor="middle" letter-spacing="0">4</text>
<text x="1000" y="520" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#a78bfa" text-anchor="start" letter-spacing="0">deliver</text>
<text x="966" y="546" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#f8fafc" text-anchor="start" letter-spacing="0">Fresh subagent checks the diff</text>
<text x="966" y="565" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#f8fafc" text-anchor="start" letter-spacing="0">against the spec.</text>
<path d="M326,551.0 L352,551.0" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-22d3ee)"/>
<path d="M622,551.0 L648,551.0" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-22d3ee)"/>
<path d="M918,551.0 L944,551.0" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-22d3ee)"/>
<path d="M1019.0,616 L1019.0,638 Q1019.0,648 1009.0,648 L793.0,648 Q783.0,648 783.0,638 L783.0,620" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow-fbbf24)"/>
<text x="901.0" y="668" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#fbbf24" text-anchor="middle" letter-spacing="0">criterion not met: fix it, then a new check</text>
<path d="M1139.0,616 L1139.0,742" fill="none" stroke="#34d399" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-34d399)"/>
<text x="1125.0" y="726" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#a5b0cf" text-anchor="end" letter-spacing="0">all criteria met, you approve</text>
<rect x="945" y="746" width="300" height="56" rx="28" fill="#34d399" fill-opacity="0.18" stroke="#34d399" stroke-width="1.5" filter="url(#glow)"/>
<text x="1095" y="780" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#f8fafc" text-anchor="middle" letter-spacing="0">Pull request, linked on the ticket</text>
<rect x="35" y="746" width="760" height="56" rx="14" fill="#141a33" stroke="#a5b0cf" stroke-opacity="0.5" stroke-dasharray="4 5"/>
<text x="55" y="780" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#fbbf24" text-anchor="start" letter-spacing="0">home-repo</text>
<text x="158" y="780" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#a5b0cf" text-anchor="start" letter-spacing="0">Optional, set up once. Work across many repos from one place; specs and plans live there.</text>
</svg>
